<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Duck Race Pro</title>
    
    <script src="https://google.com" async defer></script>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-dark: #e6b800;
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
        }

        <body>
    <div class="container">
        <!-- Auth Header -->
        <div class="header-bar">
            <h2>🦆 DuckRace Studio Pro</h2>
            <div id="auth-container">
                <div id="google-login-btn"></div>
            </div>
            <div id="user-profile" class="hidden">
                <img id="user-img" class="user-avatar" src="" alt="Avatar">
                <span id="user-name">Guest</span>
                <button onclick="logout()" style="background:transparent; color:#ef4444; border:none; cursor:pointer; font-weight:bold; margin-left:10px;">Logout</button>
            </div>
        </div>

        <!-- Setup Screen -->
        <div id="setup-container" class="panel">
            <h1>Create Custom Race</h1>
            <textarea id="names-input" placeholder="Enter names (one per line)">Alpha&#10;Bravo&#10;Charlie&#10;Delta</textarea>
            
            <div class="form-group">
                <label>
                    Race Duration (seconds)
                    <input type="number" id="duration-input" value="12" min="3" max="60">
                </label>
            </div>
            <button id="start-btn" class="btn">Launch Race 🏁</button>
        </div>

        <!-- Racing Arena -->
        <div id="race-container" class="panel hidden">
            <h2 id="timer-display" style="font-size: 28px; color: var(--primary);">Time Left: --s</h2>
            <div id="track">
                <div class="track-header-finish"></div>
            </div>
            <h1 id="winner-display" class="hidden" style="font-size: 42px; margin: 25px 0;"></h1>
            <button id="reset-btn" class="btn hidden">Back to Lobby</button>
        </div>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', startRace);
        document.getElementById('reset-btn').addEventListener('click', resetGame);

        let raceInterval, timerInterval;

        window.onload = function () {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: "://googleusercontent.com",
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-login-btn"),
                    { theme: "filled_black", size: "large", shape: "pill" }
                );
            }
        };

        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            document.getElementById('user-img').src = data.picture;
            document.getElementById('user-name').innerText = data.given_name;
        }

        function parseJwt(token) {
            var base64Url = token.split('.');
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        function logout() { location.reload(); }

        // 🟨 AUTHENTIC RUBBER DUCK VECTOR ILLUSTRATOR ENGINE 
        function drawCustomDuck(canvasId, hueColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 70, 70);

            const fillStyle = `hsl(${hueColor}, 100%, 50%)`;
            const shadowStyle = `hsl(${hueColor}, 100%, 40%)`;
            const strokeStyle = '#0b0f19';

            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // 1. FAT RUBBER DUCK BODY
            ctx.beginPath();
            ctx.moveTo(15, 38); 
            ctx.quadraticCurveTo(8, 28, 10, 24); 
            ctx.quadraticCurveTo(14, 32, 22, 35);
            ctx.bezierCurveTo(34, 35, 54, 38, 54, 50); 
            ctx.bezierCurveTo(54, 62, 22, 62, 16, 52); 
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
            ctx.strokeStyle = strokeStyle;
            ctx.stroke();

            // 2. ROUND CHUBBY HEAD OVERLAY
            ctx.beginPath();
            ctx.arc(44, 25, 11, 0, Math.PI * 2);
            ctx.fillStyle = fillStyle;
            ctx.fill();
            ctx.stroke();

            // 3. THICK STUMPY RUBBER WING
            ctx.beginPath();
            ctx.ellipse(28, 48, 10, 6, Math.PI / 10, 0, Math.PI * 2);
            ctx.fillStyle = shadowStyle; 
            ctx.fill();
            ctx.stroke();

            // 4. ROUNDED CARTOON BEAK
            ctx.beginPath();
            ctx.moveTo(53, 22);
            ctx.bezierCurveTo(64, 21, 64, 28, 53, 29); 
            ctx.bezierCurveTo(49, 29, 49, 24, 53, 22);
            ctx.closePath();
            ctx.fillStyle = '#ff5722'; 
            ctx.fill();
            ctx.stroke();

            // 5. LARGE EXPRESSIVE EYE 
            ctx.beginPath();
            ctx.arc(46, 22, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(47, 21, 0.7, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        function startRace() {
            const namesText = document.getElementById('names-input').value.trim();
            const duration = parseInt(document.getElementById('duration-input').value) || 12;
            
            if (!namesText) return alert('Enter at least one runner!');

            const names = namesText.split('\n').filter(n => n.trim() !== '');
            const track = document.getElementById('track');
            track.innerHTML = '<div class="track-header-finish"></div>';

            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('race-container').classList.remove('hidden');

            const ducks = names.map((name, index) => {
                const lane = document.createElement('div');
                lane.className = 'duck-lane';
                
                const assignedHue = Math.floor((index / names.length) * 360);
                const canvasId = `duck-canvas-${index}`;
                
                const duckElement = document.createElement('div');
                duckElement.className = 'duck';
                duckElement.innerHTML = `
                    <canvas id="${canvasId}" width="70" height="70" style="width:65px; height:65px;"></canvas>
                    <span class="duck-name">${name}</span>
                `;
                
                lane.appendChild(duckElement);
                track.appendChild(lane);

                setTimeout(() => drawCustomDuck(canvasId, assignedHue), 0);

                return { element: duckElement, name: name, position: 10, velocity: 0, finished: false };
            });

            let timeLeft = duration;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;

            const trackWidth = (track.clientWidth > 100) ? (track.clientWidth - 155) : 700; 
            let winner = null;

            raceInterval = setInterval(() => {
                ducks.forEach(duck => {
                    if (duck.finished) return;

                    let acceleration = Math.random() * 0.6;
                    if (Math.random() < 0.18) {
                        acceleration += (Math.random() - 0.45) * 3.5;
                    }

                    duck.velocity += acceleration;
                    duck.velocity *= 0.83; 
                    if (duck.velocity < 0) duck.velocity = 0;

                    duck.position += duck.velocity;

                    if (duck.position >= trackWidth) {
                        duck.position = trackWidth;
                        duck.finished = true;
                        if (!winner) winner = duck.name;
                    }
                    duck.element.style.left = duck.position + 'px';
                });
            }, 33);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(raceInterval);
                    clearInterval(timerInterval);
                    
                    // FIX: Safely extract first duck object from array index 0
                    if (!winner && ducks.length > 0) {
                        const sorted = [...ducks].sort((a,b) => b.position - a.position);
                        const topDuck = sorted[0]; 
                        winner = topDuck.name;
                        topDuck.element.style.left = trackWidth + 'px';
                    }
                    declareWinner(winner);
                }
            }, 1000);
        }

        function declareWinner(name) {
            const display = document.getElementById('winner-display');
            display.innerText = `👑 WINNER: ${name}! 👑`;
            display.classList.remove('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
        }

        function resetGame() {
            document.getElementById('setup-container').classList.remove('hidden');
            document.getElementById('race-container').classList.add('hidden');
            document.getElementById('winner-display').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            clearInterval(raceInterval);
            clearInterval(timerInterval);
        }
    </script>
</body>
</html>
