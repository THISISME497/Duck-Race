<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mrs.Millenni's Duck Race</title>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-dark: #e6b800;
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        textarea {
            width: 100%;
            max-width: 500px;
            height: 120px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            color: white;
            padding: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }
        .form-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        input[type="number"] {
            background: #334155;
            border: 2px solid #475569;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.6);
        }

        #track-viewport {
            width: 100%;
            overflow-x: hidden;
            border: 6px solid #1e293b;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            background: #166534;
        }

        #track {
            width: 100%;
            position: relative;
            left: 0;
            transition: left 0.1s ease-out;
            padding: 0;
        }

        .scenic-bank {
            height: 40px;
            background: #166534;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .tree-decoration {
            position: absolute;
            font-size: 26px;
            bottom: 4px;
            user-select: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .river-bed {
            background: linear-gradient(180deg, #0284c7, #0369a1);
            position: relative;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.3), inset 0 -10px 20px rgba(0,0,0,0.3);
        }

        .track-header-finish {
            position: absolute;
            right: 140px;
            top: 0;
            bottom: 0;
            width: 24px;
            background: repeating-linear-gradient(45deg, #fff, #fff 12px, #000 12px, #000 24px);
            z-index: 2;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
        }

        .duck-lane {
            height: 80px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.25);
            position: relative;
            display: flex;
            align-items: center;
        }

        .duck-lane:last-child {
            border-bottom: none;
        }

        .buoy-marker {
            position: absolute;
            font-size: 14px;
            opacity: 0.4;
            user-select: none;
            color: #fff;
            font-weight: bold;
            border-left: 2px dotted rgba(255,255,255,0.3);
            height: 100%;
            padding-left: 5px;
            display: flex;
            align-items: flex-start;
            padding-top: 5px;
        }

        .duck {
            position: absolute;
            left: 10px;
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: left 0.03s linear;
            z-index: 3;
        }

        .duck-name {
            font-size: 11px;
            font-weight: bold;
            color: #0f172a;
            background: #fff;
            padding: 2px 6px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
            margin-top: -2px;
            border: 1px solid #cbd5e1;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>Duck Race Headquarters🦆</h2>
        </div>

        <!-- Setup Screen -->
        <div id="setup-container" class="panel">
            <h1>Create Duck Race</h1>
            <textarea id="names-input" placeholder="Enter names (one per line)">Alpha&#10;Bravo&#10;Charlie&#10;Delta</textarea>
            
            <div class="form-group">
                <label>
                    Race Time (seconds)
                    <input type="number" id="duration-input" value="15" min="3" max="9999">
                </label>
            </div>
            <button id="start-btn" class="btn">Start Race!</button>
        </div>

        <!-- Racing Arena -->
        <div id="race-container" class="panel hidden">
            <h2 id="timer-display" style="font-size: 28px; color: var(--primary);">Time Left: --s</h2>
            <div id="track-viewport">
                <div id="track">
                    <div id="top-bank" class="scenic-bank"></div>
                    <div id="river" class="river-bed">
                        <div class="track-header-finish"></div>
                    </div>
                    <div id="bottom-bank" class="scenic-bank"></div>
                </div>
            </div>
            <h1 id="winner-display" class="hidden" style="font-size: 42px; margin: 25px 0;"></h1>
            <button id="reset-btn" class="btn hidden">Back To Lobby</button>
        </div
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', startRace);
        document.getElementById('reset-btn').addEventListener('click', resetGame);

        let raceInterval, timerInterval;

        const riggedWinners = ["justin", "lucas", "samuel", "sam", "danyil", "ryder", "sadik", "nadir", "shagoto", "ethan", "nash"];

        function drawCustomDuck(canvasId, hueColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 60, 60);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 3;

            // Body
            ctx.beginPath();
            ctx.arc(26, 36, 16, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`; 
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#050b14';
            ctx.stroke();

            // Tail
            ctx.beginPath();
            ctx.moveTo(12, 30);
            ctx.quadraticCurveTo(4, 22, 6, 34);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(40, 22, 10, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.stroke();

            ctx.shadowColor = 'transparent';

            // Beak
            ctx.beginPath();
            ctx.moveTo(48, 20);
            ctx.quadraticCurveTo(58, 22, 48, 26);
            ctx.closePath();
            ctx.fillStyle = '#ff5722';
            ctx.fill();
            ctx.stroke();

            // Eye
            ctx.beginPath();
            ctx.arc(42, 19, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(43, 18, 0.8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Wing
            ctx.beginPath();
            ctx.ellipse(24, 37, 8, 5, Math.PI / 12, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 45%)`; 
            ctx.fill();
            ctx.stroke();
        }
        function populateForestScenery(trackWidth) {
            const topBank = document.getElementById('top-bank');
            const bottomBank = document.getElementById('bottom-bank');
            const river = document.getElementById('river');
            
            topBank.innerHTML = '';
            bottomBank.innerHTML = '';
            
            const treeSkins = ['🌲', '🌳', '🌴', '🌿'];
            const spacing = 75; 
            const totalDecorations = Math.floor(trackWidth / spacing);

            for (let i = 0; i < totalDecorations - 2; i++) {
                const xPos = 40 + (i * spacing) + (Math.random() * 20);
                
                const topTree = document.createElement('span');
                topTree.className = 'tree-decoration';
                topTree.innerText = treeSkins[Math.floor(Math.random() * treeSkins.length)];
                topTree.style.left = xPos + 'px';
                topTree.style.transform = `scale(${0.8 + Math.random() * 0.4})`;
                topBank.appendChild(topTree);

                const bottomTree = document.createElement('span');
                bottomTree.className = 'tree-decoration';
                bottomTree.innerText = treeSkins[Math.floor(Math.random() * treeSkins.length)];
                bottomTree.style.left = (xPos + 30) + 'px'; 
                bottomTree.style.transform = `scale(${0.8 + Math.random() * 0.4})`;
                bottomBank.appendChild(bottomTree);
            }

            const buoySpacing = 400;
            const totalBuoys = Math.floor(trackWidth / buoySpacing);
            for (let b = 1; b < totalBuoys; b++) {
                const buoyX = b * buoySpacing;
                if (buoyX < trackWidth - 250) {
                    const buoy = document.createElement('div');
                    buoy.className = 'buoy-marker';
                    buoy.style.left = buoyX + 'px';
                    buoy.innerText = `🚩 ${buoyX}m`;
                    river.appendChild(buoy);
                }
            }
        }

        function startRace() {
            const namesText = document.getElementById('names-input').value.trim();
            const duration = parseInt(document.getElementById('duration-input').value) || 15;
            
            if (!namesText) return alert('Enter at least one runner!');

            const names = namesText.split('\n').filter(n => n.trim() !== '');
            const trackViewport = document.getElementById('track-viewport');
            const track = document.getElementById('track');
            const river = document.getElementById('river');
            
            const dynamicTrackWidth = Math.max(trackViewport.clientWidth, duration * 150);
            track.style.width = dynamicTrackWidth + 'px';
            track.style.left = '0px'; 
            
            river.innerHTML = '<div class="track-header-finish"></div>';
            populateForestScenery(dynamicTrackWidth);

            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('race-container').classList.remove('hidden');

            // Find matching entries
            const activeRiggedDucks = names.filter(name => 
                riggedWinners.includes(name.trim().toLowerCase())
            );
            
            // 🎯 FIXED RANDOM SELECTION MATH: Scrambles pool lists to prevent the first-row win glitch
            const chosenRiggedWinner = activeRiggedDucks.length > 0 
                ? activeRiggedDucks[Math.floor(Math.random() * activeRiggedDucks.length)].trim().toLowerCase()
                : null;

            const ducks = names.map((name, index) => {
                const lane = document.createElement('div');
                lane.className = 'duck-lane';
                
                const assignedHue = Math.floor((index / names.length) * 360);
                const canvasId = `duck-canvas-${index}`;
                
                const duckElement = document.createElement('div');
                duckElement.className = 'duck';
                duckElement.innerHTML = `
                    <canvas id="${canvasId}" width="60" height="60" style="width:55px; height:55px;"></canvas>
                    <span class="duck-name">${name}</span>
                `;
                
                lane.appendChild(duckElement);
                river.appendChild(lane);

                setTimeout(() => drawCustomDuck(canvasId, assignedHue), 0);

                return { 
                    element: duckElement, 
                    name: name.trim(), 
                    position: 10, 
                    wobbleSeed: Math.random() * 50
                };
            });

            let timeLeft = duration;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;

            const finishLineX = dynamicTrackWidth - 210; 
            const startTime = Date.now();
            const totalDurationMs = duration * 1000;
            let winner = null;
            timerInterval = setInterval(() => {
                if (winner) return;
                timeLeft--;
                if (timeLeft < 0) timeLeft = 0;
                timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;
            }, 1000);

            raceInterval = setInterval(() => {
                const elapsedMs = Date.now() - startTime;
                const timeProgress = Math.min(elapsedMs / totalDurationMs, 1.0);
                
                let maxPosition = 0;

                ducks.forEach(duck => {
                    if (winner) return;

                    const naturalWobble = Math.sin(elapsedMs * 0.004 + duck.wobbleSeed) * 20;
                    let currentScaleFactor = 0.95; 

                    const cleanName = duck.name.toLowerCase();

                    if (chosenRiggedWinner) {
                        if (timeProgress < 0.75) {
                            if (cleanName === chosenRiggedWinner) {
                                currentScaleFactor = 0.88 + (Math.sin(elapsedMs * 0.002) * 0.08); 
                            } else {
                                currentScaleFactor = 0.92 + (Math.cos(elapsedMs * 0.0015 + duck.wobbleSeed) * 0.12);
                            }
                        } else {
                            const finishStretchProgress = (timeProgress - 0.75) / 0.25; 
                            
                            if (cleanName === chosenRiggedWinner) {
                                currentScaleFactor = 0.90 + (finishStretchProgress * 0.26); 
                            } else {
                                currentScaleFactor = Math.min(1.0, 1.02 - (finishStretchProgress * 0.08));
                            }
                        }
                    } else {
                        currentScaleFactor = 0.88 + (Math.sin(elapsedMs * 0.001 + duck.wobbleSeed) * 0.15);
                    }

                    duck.position = 10 + (finishLineX - 10) * timeProgress * currentScaleFactor + naturalWobble;

                    if (duck.position < 10) duck.position = 10;
                    if (duck.position >= finishLineX || timeProgress >= 1.0) {
                        duck.position = finishLineX;
                    }

                    if (duck.position > maxPosition) { maxPosition = duck.position; }

                    if (duck.position >= finishLineX && !winner) {
                        winner = duck.name;
                    }

                    duck.element.style.left = duck.position + 'px';
                });

                const viewWidth = trackViewport.clientWidth;
                if (maxPosition > viewWidth * 0.4) {
                    const cameraOffset = (viewWidth * 0.4) - maxPosition;
                    const minLeft = viewWidth - dynamicTrackWidth;
                    track.style.left = Math.max(minLeft, cameraOffset) + 'px';
                }

                if (timeProgress >= 1.0 || winner) {
                    clearInterval(raceInterval);
                    clearInterval(timerInterval);
                    
                    // 🎯 PRODUCTION ARRAY INDICATOR FIX: Safely loads the zero element property to prevent initial load freeze
                    if (!winner && ducks.length > 0) {
                        const sorted = [...ducks].sort((a,b) => b.position - a.position);
                        winner = sorted[0].name; 
                    }
                    declareWinner(winner);
                }
            }, 33);
        }

        function declareWinner(name) {
            const display = document.getElementById('winner-display');
            const formattedName = name.charAt(0).toUpperCase() + name.slice(1);
            display.innerText = `👑 WINNER: ${formattedName}! 👑`;
            display.classList.remove('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
            document.getElementById('timer-display').innerText = "Race Finished!";
        }

        function resetGame() {
            document.getElementById('setup-container').classList.remove('hidden');
            document.getElementById('race-container').classList.add('hidden');
            document.getElementById('winner-display').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            document.getElementById('timer-display').innerText = "Time Remaining: --s";
            document.getElementById('track').style.left = '0px';
            clearInterval(raceInterval);
            clearInterval(timerInterval);
        }
    </script>
</body>
</html>
