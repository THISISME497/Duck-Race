<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Duck Race Pro</title>
    
    <script src="https://google.com" async defer></script>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-dark: #e6b800;
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 30px;
        }

        #user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        textarea {
            width: 100%;
            max-width: 500px;
            height: 120px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            color: white;
            padding: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }
        .form-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        input[type="number"] {
            background: #334155;
            border: 2px solid #475569;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.6);
        }

        #track {
            width: 100%;
            background: linear-gradient(180deg, #0284c7, #0369a1);
            border: 6px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.4);
            margin: 20px 0;
        }

        .track-header-finish {
            position: absolute;
            right: 80px;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, #000 10px, #000 20px);
            z-index: 2;
        }

        .duck-lane {
            height: 75px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            position: relative;
            display: flex;
            align-items: center;
        }

        .duck-lane:last-child {
            border-bottom: none;
        }

        .duck {
            position: absolute;
            left: 10px;
            width: 55px;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: left 0.03s linear;
            z-index: 3;
        }

        .duck-name {
            font-size: 11px;
            font-weight: bold;
            color: #0f172a;
            background: #fff;
            padding: 2px 6px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
            margin-top: -2px;
            border: 1px solid #cbd5e1;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Header -->
        <div class="header-bar">
            <h2>🦆 DuckRace Studio Pro</h2>
            <div id="auth-container">
                <div id="google-login-btn"></div>
            </div>
            <div id="user-profile" class="hidden">
                <img id="user-img" class="user-avatar" src="" alt="Avatar">
                <span id="user-name">Guest</span>
                <button onclick="logout()" style="background:transparent; color:#ef4444; border:none; cursor:pointer; font-weight:bold; margin-left:10px;">Logout</button>
            </div>
        </div>

        <!-- Setup Screen -->
        <div id="setup-container" class="panel">
            <h1>Create Custom Race</h1>
            <textarea id="names-input" placeholder="Enter names (one per line)">Alpha&#10;Bravo&#10;Charlie&#10;Delta</textarea>
            
            <div class="form-group">
                <label>
                    Race Duration (seconds)
                    <input type="number" id="duration-input" value="12" min="3" max="60">
                </label>
            </div>
            <button id="start-btn" class="btn">Launch Race 🏁</button>
        </div>

        <!-- Racing Arena -->
        <div id="race-container" class="panel hidden">
            <h2 id="timer-display" style="font-size: 28px; color: var(--primary);">Time Left: --s</h2>
            <div id="track">
                <div class="track-header-finish"></div>
            </div>
            <h1 id="winner-display" class="hidden" style="font-size: 42px; margin: 25px 0;"></h1>
            <button id="reset-btn" class="btn hidden">Back to Lobby</button>
        </div>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', startRace);
        document.getElementById('reset-btn').addEventListener('click', resetGame);

        let raceInterval, timerInterval;

        window.onload = function () {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: "://googleusercontent.com",
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-login-btn"),
                    { theme: "filled_black", size: "large", shape: "pill" }
                );
            }
        };

        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            document.getElementById('user-img').src = data.picture;
            document.getElementById('user-name').innerText = data.given_name;
        }

        function parseJwt(token) {
            var base64Url = token.split('.');
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        function logout() { location.reload(); }

        function drawCustomDuck(canvasId, hueColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 60, 60);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 3;

            // Draw Body
            ctx.beginPath();
            ctx.arc(26, 36, 16, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#050b14';
            ctx.stroke();

            // Draw Tail details
            ctx.beginPath();
            ctx.moveTo(12, 30);
            ctx.quadraticCurveTo(4, 22, 6, 34);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.stroke();

            // Draw Head
            ctx.beginPath();
            ctx.arc(40, 22, 10, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.stroke();

            ctx.shadowColor = 'transparent';

            // Draw Beak 
            ctx.beginPath();
            ctx.moveTo(48, 20);
            ctx.quadraticCurveTo(58, 22, 48, 26);
            ctx.closePath();
            ctx.fillStyle = '#ff5722';
            ctx.fill();
            ctx.stroke();

            // Draw Eye 
            ctx.beginPath();
            ctx.arc(42, 19, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(43, 18, 0.8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Draw Wing layer accent
            ctx.beginPath();
            ctx.ellipse(24, 37, 8, 5, Math.PI / 12, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 45%)`;
            ctx.fill();
            ctx.stroke();
        }

        function startRace() {
            const namesText = document.getElementById('names-input').value.trim();
            const duration = parseInt(document.getElementById('duration-input').value) || 12;
            
            if (!namesText) return alert('Enter at least one runner!');

            const names = namesText.split('\n').filter(n => n.trim() !== '');
            const track = document.getElementById('track');
            track.innerHTML = '<div class="track-header-finish"></div>';

            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('race-container').classList.remove('hidden');

            const ducks = names.map((name, index) => {
                const lane = document.createElement('div');
                lane.className = 'duck-lane';
                
                const assignedHue = Math.floor((index / names.length) * 360);
                const canvasId = `duck-canvas-${index}`;
                
                const duckElement = document.createElement('div');
                duckElement.className = 'duck';
                duckElement.innerHTML = `
                    <canvas id="${canvasId}" width="60" height="60" style="width:55px; height:55px;"></canvas>
                    <span class="duck-name">${name}</span>
                `;
                
                lane.appendChild(duckElement);
                track.appendChild(lane);

                setTimeout(() => drawCustomDuck(canvasId, assignedHue), 0);

                return { element: duckElement, name: name, position: 10, velocity: 0, finished: false };
            });

            let timeLeft = duration;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;

            const trackWidth = track.clientWidth - 145; 
            let winner = null;

            raceInterval = setInterval(() => {
                ducks.forEach(duck => {
                    if (duck.finished) return;

                    let acceleration = Math.random() * 0.6;
                    if (Math.random() < 0.18) {
                        acceleration += (Math.random() - 0.45) * 3.5;
                    }

                    duck.velocity += acceleration;
                    duck.velocity *= 0.83; 
                    if (duck.velocity < 0) duck.velocity = 0;

                    duck.position += duck.velocity;

                    if (duck.position >= trackWidth) {
                        duck.position = trackWidth;
                        duck.finished = true;
                        if (!winner) winner = duck.name;
                    }
                    duck.element.style.left = duck.position + 'px';
                });
            }, 33);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(raceInterval);
                    clearInterval(timerInterval);
                    
                    if (!winner && ducks.length > 0) {
                        const sorted = [...ducks].sort((a,b) => b.position - a.position);
                        winner = sorted[0].name;
                        sorted[0].element.style.left = trackWidth + 'px';
                    }
                    declareWinner(winner);
                }
            }, 1000);
        }

        function declareWinner(name) {
            const display = document.getElementById('winner-display');
            display.innerText = `👑 WINNER: ${name}! 👑`;
            display.classList.remove('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
        }

        function resetGame() {
            document.getElementById('setup-container').classList.remove('hidden');
            document.getElementById('race-container').classList.add('hidden');
            document.getElementById('winner-display').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            clearInterval(raceInterval);
            clearInterval(timerInterval);
        }
    </script>
</body>
</html>
