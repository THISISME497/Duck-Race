<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Duck Race Pro</title>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-dark: #e6b800;
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        textarea {
            width: 100%;
            max-width: 500px;
            height: 120px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            color: white;
            padding: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .form-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        input[type="number"] {
            background: #334155;
            border: 2px solid #475569;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.6);
        }

        /* 🎥 CAMERA WINDOW LOOKOUT CONTAINER */
        #track-viewport {
            width: 100%;
            overflow-x: hidden; /* Crops out the rest of the massive track */
            border: 6px solid #1e293b;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            background: #0284c7;
        }

        /* The actual expandable track lane canvas backdrop */
        #track {
            width: 100%; /* Dynamically changed by JavaScript */
            background: linear-gradient(180deg, #1e90ff, #00bfff);
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
            padding: 10px 0;
            left: 0;
            transition: left 0.1s ease-out; /* Smooth camera panning effect */
        }

        .track-header-finish {
            position: absolute;
            right: 120px;
            top: 0;
            bottom: 0;
            width: 20px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, #000 10px, #000 20px);
            z-index: 2;
        }

        .duck-lane {
            height: 75px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            position: relative;
            display: flex;
            align-items: center;
        }

        .duck-lane:last-child {
            border-bottom: none;
        }

        .duck {
            position: absolute;
            left: 10px;
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: left 0.03s linear;
            z-index: 3;
        }

        .duck-name {
            font-size: 11px;
            font-weight: bold;
            color: #0f172a;
            background: #fff;
            padding: 2px 6px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
            margin-top: -2px;
            border: 1px solid #cbd5e1;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>🦆 DuckRace Studio Pro</h2>
        </div>

        <!-- Setup Screen -->
        <div id="setup-container" class="panel">
            <h1>Create Custom Race</h1>
            <textarea id="names-input" placeholder="Enter names (one per line)">Alpha&#10;Bravo&#10;Charlie&#10;Delta</textarea>
            
            <div class="form-group">
                <label>
                    Race Time (seconds)
                    <input type="number" id="duration-input" value="15" min="3" max="9999">
                </label>
            </div>
            <button id="start-btn" class="btn">Launch Race 🏁</button>
        </div>

        <!-- Racing Arena -->
        <div id="race-container" class="panel hidden">
            <h2 id="timer-display" style="font-size: 28px; color: var(--primary);">Time Left: --s</h2>
            <div id="track-viewport">
                <div id="track">
                    <div class="track-header-finish"></div>
                </div>
            </div>
            <h1 id="winner-display" class="hidden" style="font-size: 42px; margin: 25px 0;"></h1>
            <button id="reset-btn" class="btn hidden">Back to Lobby</button>
        </div>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', startRace);
        document.getElementById('reset-btn').addEventListener('click', resetGame);

        let raceInterval, timerInterval;

        function drawCustomDuck(canvasId, hueColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 60, 60);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 3;

            // Body
            ctx.beginPath();
            ctx.arc(26, 36, 16, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`; 
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#050b14';
            ctx.stroke();

            // Tail
            ctx.beginPath();
            ctx.moveTo(12, 30);
            ctx.quadraticCurveTo(4, 22, 6, 34);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(40, 22, 10, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 55%)`;
            ctx.fill();
            ctx.stroke();

            ctx.shadowColor = 'transparent';

            // Beak
            ctx.beginPath();
            ctx.moveTo(48, 20);
            ctx.quadraticCurveTo(58, 22, 48, 26);
            ctx.closePath();
            ctx.fillStyle = '#ff5722';
            ctx.fill();
            ctx.stroke();

            // Eye
            ctx.beginPath();
            ctx.arc(42, 19, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(43, 18, 0.8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Wing
            ctx.beginPath();
            ctx.ellipse(24, 37, 8, 5, Math.PI / 12, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${hueColor}, 95%, 45%)`; 
            ctx.fill();
            ctx.stroke();
        }

        function startRace() {
            const namesText = document.getElementById('names-input').value.trim();
            const duration = parseInt(document.getElementById('duration-input').value) || 15;
            
            if (!namesText) return alert('Enter at least one runner!');

            const names = namesText.split('\n').filter(n => n.trim() !== '');
            const trackViewport = document.getElementById('track-viewport');
            const track = document.getElementById('track');
            
            // 🏎️ DYNAMIC LONG-DISTANCE ENGINE RATIO
            // Base speed is around 150px per second. We widen the track based on your set seconds!
            const dynamicTrackWidth = Math.max(trackViewport.clientWidth, duration * 140);
            track.style.width = dynamicTrackWidth + 'px';
            track.style.left = '0px'; // Reset track scroll placement
            
            track.innerHTML = '<div class="track-header-finish"></div>';

            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('race-container').classList.remove('hidden');

            const ducks = names.map((name, index) => {
                const lane = document.createElement('div');
                lane.className = 'duck-lane';
                
                const assignedHue = Math.floor((index / names.length) * 360);
                const canvasId = `duck-canvas-${index}`;
                
                const duckElement = document.createElement('div');
                duckElement.className = 'duck';
                duckElement.innerHTML = `
                    <canvas id="${canvasId}" width="60" height="60" style="width:55px; height:55px;"></canvas>
                    <span class="duck-name">${name}</span>
                `;
                
                lane.appendChild(duckElement);
                track.appendChild(lane);

                setTimeout(() => drawCustomDuck(canvasId, assignedHue), 0);

                return { element: duckElement, name: name, position: 10, velocity: 0 };
            });

            let timeLeft = duration;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;

            const finishLineX = dynamicTrackWidth - 180; 
            let winner = null;

            // ⏱️ Accurate 1-Second Global Countdown Loop
            timerInterval = setInterval(() => {
                if (winner) return;
                timeLeft--;
                if (timeLeft < 0) timeLeft = 0;
                timerDisplay.innerText = `Time Remaining: ${timeLeft}s`;
            }, 1000);

            // 🎬 30fps Real-Time Physics and Dynamic Camera Engine
            raceInterval = setInterval(() => {
                let maxPosition = 0;

                ducks.forEach(duck => {
                    if (winner) return;

                    // Standard unthrottled movement parameters
                    let acceleration = Math.random() * 0.7;
                    if (Math.random() < 0.16) {
                        acceleration += (Math.random() - 0.45) * 4.2;
                    }

                    duck.velocity += acceleration;
                    duck.velocity *= 0.84; 
                    if (duck.velocity < 0) duck.velocity = 0;

                    duck.position += duck.velocity;

                    if (duck.position > maxPosition) {
                        maxPosition = duck.position;
                    }

                    // Natural finish line verification trigger
                    if (duck.position >= finishLineX) {
                        duck.position = finishLineX;
                        winner = duck.name;
                    }
                    duck.element.style.left = duck.position + 'px';
                });

                // 🎥 THE LIVE CAMERA PANNING MECHANIC:
                // Shifts the water track layout backward relative to how far out the leader swims
                const viewWidth = trackViewport.clientWidth;
                if (maxPosition > viewWidth * 0.4) {
                    const cameraOffset = (viewWidth * 0.4) - maxPosition;
                    // Prevent camera from scrolling past the finish line checkerboard wall
                    const minLeft = viewWidth - dynamicTrackWidth;
                    track.style.left = Math.max(minLeft, cameraOffset) + 'px';
                }

                if (winner) {
                    clearInterval(raceInterval);
                    clearInterval(timerInterval);
                    declareWinner(winner);
                }
            }, 33);
        }

        function declareWinner(name) {
            const display = document.getElementById('winner-display');
            display.innerText = `👑 WINNER: ${name}! 👑`;
            display.classList.remove('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
            document.getElementById('timer-display').innerText = "Race Finished!";
        }

        function resetGame() {
            document.getElementById('setup-container').classList.remove('hidden');
            document.getElementById('race-container').classList.add('hidden');
            document.getElementById('winner-display').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            document.getElementById('timer-display').innerText = "Time Remaining: --s";
            document.getElementById('track').style.left = '0px';
            clearInterval(raceInterval);
            clearInterval(timerInterval);
        }
    </script>
</body>
</html>
